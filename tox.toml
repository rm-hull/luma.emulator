requires = ["tox>=4.21"]
env_list = ["py39", "py310", "py311", "py312", "py313", "py314", "qa", "doc"]
skip_missing_interpreters = true

[env_run_base]
set_env = { PYTHONDEVMODE = "1", DISTUTILS_DEBUG = "0", PYTHONTRACEMALLOC = "1" }
deps = [".[test]"]
commands = [
    ["coverage", "erase"],
    ["python", "-m", "pytest", "--cov=luma"],
    ["coverage", "html"],
]

[env.qa]
deps = [".[qa]"]
commands = [
    ["flake8"],
    ["rstcheck", "README.rst"],
]

[env.doc]
changedir = "doc"
deps = [".[docs]"]
commands = [
    ["sphinx-build", "-W", "-b", "html", "-d", "{env_tmp_dir}/doctrees", ".", "{env_tmp_dir}/html"],
]
